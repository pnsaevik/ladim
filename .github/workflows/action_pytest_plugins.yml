name: Test plugins

on: workflow_call

jobs:
  pytest-jobs:
    runs-on: ubuntu-latest
    name: Run pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ladim
        run: pip install .
      - name: Install plugins
        run: pip install ladim_plugins
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: pytest --pyargs ladim_plugins -m "not opendap"
